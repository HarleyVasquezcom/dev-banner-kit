<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vertical Mobile Banner — Programming &amp; Web Development — Español</title>
<style>
  :root{
    --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6; --green:#34d399; --amber:#fbbf24;
    --txt:#f1f5ff; --dim:rgba(241,245,255,.62);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#05060c;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }

  /* ============ BANNER ============ */
  .banner{
    position:relative;
    width:300px;height:600px;
    border-radius:20px;
    overflow:hidden;
    user-select:none;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px -30px rgba(34,211,238,.25), 0 20px 60px -20px rgba(0,0,0,.9);
    background:linear-gradient(150deg,#070b18 0%,#0d1330 45%,#1b1040 100%);
    background-size:180% 180%;
    animation:bgShift 14s ease-in-out infinite alternate;
  }
  @keyframes bgShift{to{background-position:100% 100%}}

  .blob{position:absolute;border-radius:50%;filter:blur(58px);pointer-events:none;z-index:0}
  .blob.b1{width:230px;height:230px;top:-90px;left:-90px;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%);animation:drift1 12s ease-in-out infinite alternate}
  .blob.b2{width:250px;height:250px;bottom:-110px;right:-100px;background:radial-gradient(circle,rgba(167,139,250,.4),transparent 70%);animation:drift2 15s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(70px,50px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-60px,-40px) scale(1.2)}}

  .grid-overlay{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 78%);
  }

  .symbols{position:absolute;inset:0;z-index:1;pointer-events:none}
  .sym{
    position:absolute;bottom:-24px;
    font-family:Consolas,"Cascadia Code",monospace;font-weight:700;
    animation:rise linear infinite;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translateY(0);opacity:0}
    10%{opacity:var(--o,.35)}
    80%{opacity:var(--o,.35)}
    100%{transform:translateY(-660px);opacity:0}
  }

  .inner{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;
    padding:18px 18px 16px;
    gap:11px;
  }

  
  /* top row */
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    font:700 12px/1 Consolas,monospace;color:#071018;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 6px 18px -6px rgba(34,211,238,.65);
  }
  .lang{
    display:flex;padding:3px;border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
  }
  .lang button{
    border:0;background:transparent;cursor:pointer;
    color:var(--dim);padding:5px 11px;border-radius:999px;
    font:700 10px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;
    transition:color .2s ease, background .2s ease;
  }
  .lang button.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#071018}
  .lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* status */
  .status{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.03em}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:ping 2s ease-out infinite;flex:none}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  /* headline */
  h1{font-size:24px;line-height:1.14;font-weight:800;letter-spacing:-.015em;margin:1px 0 2px}
  h1 span{display:block;color:var(--txt)}
  h1 .accent{
    background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* code window */
  .code{
    border-radius:12px;padding:10px 12px 12px;
    background:rgba(5,8,20,.74);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 10px 30px -12px rgba(0,0,0,.85), inset 0 0 24px rgba(34,211,238,.05);
  }
  .code-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .wd{width:7px;height:7px;border-radius:50%}
  .wd.r{background:#ff5f57}.wd.y{background:#febc2e}.wd.g{background:#28c840}
  .code-name{margin-left:auto;font:600 9px/1 Consolas,monospace;color:rgba(241,245,255,.45);letter-spacing:.08em}
  .code pre{
    font:500 10.5px/1.5 Consolas,"Cascadia Code",monospace;
    color:#dbe7ff;height:112px;overflow:hidden;white-space:pre;
  }
  .kw{color:var(--violet)}
  .var{color:var(--cyan)}
  .punc{color:rgba(219,231,255,.55)}
  .prop{color:#93c5fd}
  .str{color:var(--green)}
  .fn{color:var(--amber)}
  .cursor{
    display:inline-block;width:7px;height:13px;border-radius:2px;
    background:var(--cyan);vertical-align:-2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* service chips */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip{
    display:flex;align-items:center;gap:6px;
    padding:8px;border-radius:10px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
    font-size:10.5px;font-weight:600;color:var(--txt);
    white-space:nowrap;overflow:hidden;
    opacity:0;
    animation:pop .55s cubic-bezier(.2,.9,.3,1.35) forwards;
  }
  .chip:nth-child(1){animation-delay:.15s}
  .chip:nth-child(2){animation-delay:.28s}
  .chip:nth-child(3){animation-delay:.41s}
  .chip:nth-child(4){animation-delay:.54s}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
  .chip svg{width:13px;height:13px;flex:none}
  .chip:nth-child(1) svg{color:var(--cyan)}
  .chip:nth-child(2) svg{color:var(--violet)}
  .chip:nth-child(3) svg{color:var(--pink)}
  .chip:nth-child(4) svg{color:var(--green)}

  /* CTA */
  .cta-wrap{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .cta{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 16px;border:0;border-radius:12px;cursor:pointer;
    font:700 14px/1 "Segoe UI",system-ui,sans-serif;color:#071018;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--cyan));
    background-size:200% 100%;
    animation:ctaGrad 4s ease-in-out infinite alternate, ctaPulse 2.4s ease-in-out infinite;
  }
  @keyframes ctaGrad{to{background-position:100% 0}}
  @keyframes ctaPulse{
    0%,100%{box-shadow:0 8px 24px -8px rgba(34,211,238,.55)}
    50%{box-shadow:0 8px 34px -6px rgba(167,139,250,.8)}
  }
  .cta::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .cta svg{width:15px;height:15px;transition:transform .25s ease}
  .cta:hover svg{transform:translateX(3px)}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .sub{text-align:center;font-size:10.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}

  /* footer */
  .foot{
    text-align:center;font-size:9px;font-weight:700;
    letter-spacing:.16em;color:rgba(241,245,255,.38);
  }

  .hint{color:#4b5468;font-size:12px;letter-spacing:.02em}

  @media (prefers-reduced-motion: reduce){
    .banner,.blob,.symbols,.cta,.cta::after{animation:none !important}
    .sym{display:none}
    .chip,.cursor{animation:none;opacity:1}
  }
</style>
</head>
<body>

<div class="banner" id="banner" aria-label="Programming and web development services banner">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="grid-overlay"></div>

  <div class="symbols" aria-hidden="true">
    <span class="sym" style="left:5%;  font-size:13px; color:#22d3ee; --o:.4;  animation-duration:13s; animation-delay:-2s;  ">&lt;/&gt;</span>
    <span class="sym" style="left:22%; font-size:11px; color:#a78bfa; --o:.35; animation-duration:16s; animation-delay:-7s;  ">{ }</span>
    <span class="sym" style="left:40%; font-size:12px; color:#f472b6; --o:.3;  animation-duration:11s; animation-delay:-4s;  ">=&gt;</span>
    <span class="sym" style="left:58%; font-size:11px; color:#34d399; --o:.35; animation-duration:15s; animation-delay:-11s; ">&lt;div&gt;</span>
    <span class="sym" style="left:76%; font-size:12px; color:#22d3ee; --o:.4;  animation-duration:12s; animation-delay:-6s;  ">npm</span>
    <span class="sym" style="left:88%; font-size:11px; color:#a78bfa; --o:.3;  animation-duration:17s; animation-delay:-1s;  ">JS</span>
    <span class="sym" style="left:12%; font-size:12px; color:#fbbf24; --o:.3;  animation-duration:14s; animation-delay:-9s;  ">( )</span>
    <span class="sym" style="left:33%; font-size:11px; color:#22d3ee; --o:.35; animation-duration:16s; animation-delay:-14s; ">;</span>
    <span class="sym" style="left:50%; font-size:11px; color:#f472b6; --o:.3;  animation-duration:13s; animation-delay:-3s;  ">CSS</span>
    <span class="sym" style="left:68%; font-size:12px; color:#34d399; --o:.3;  animation-duration:18s; animation-delay:-8s;  ">API</span>
    <span class="sym" style="left:82%; font-size:11px; color:#fbbf24; --o:.35; animation-duration:12s; animation-delay:-12s; ">$</span>
    <span class="sym" style="left:3%;  font-size:11px; color:#a78bfa; --o:.3;  animation-duration:17s; animation-delay:-5s;  ">{ }</span>
  </div>

  <div class="inner">
    <div class="top">
      <div class="logo">&lt;/&gt;</div>
      <div class="lang"><button class="lang-btn active" type="button">ES</button></div>
    </div>

    <div class="status">
      <span class="live-dot"></span>
      <span >Disponibles para nuevos proyectos</span>
    </div>

    <h1>
      <span >Convertimos ideas en</span>
      <span class="accent" >código real.</span>
    </h1>

    <div class="code">
      <div class="code-head">
        <span class="wd r"></span><span class="wd y"></span><span class="wd g"></span>
        <span class="code-name">app.js</span>
      </div>
      <pre><span id="typed"></span></pre>
    </div>

    <div class="chips">
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.6-4-9s1.5-6.4 4-9z"/></svg>
        <span >Sitios web</span>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
        <span >Apps móviles</span>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h7.6a1.6 1.6 0 0 0 1.6-1.3L20 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span >Tiendas online</span>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13.5 3 5 13.5h5L10.5 21 19 10.5h-5L13.5 3z"/></svg>
        <span >SEO y velocidad</span>
      </div>
    </div>

    <div class="cta-wrap">
      <button class="cta" type="button">
        <span >Empieza tu proyecto</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="sub" >Cotización gratis en 24 horas</div>
    </div>

    <div class="foot" >PROGRAMACIÓN Y DESARROLLO WEB</div>
  </div>
</div>

<p class="hint">300 &times; 600 px — vertical mobile banner — Español</p>

<script>
  const snippet = [
    [['kw','const '],['var','proyecto'],['punc',' = {']],
    [['ind','  '],['prop','idea'],['punc',': '],['str','"tuya"'],['punc',',']],
    [['ind','  '],['prop','stack'],['punc',': '],['str','"moderno"'],['punc',',']],
    [['ind','  '],['prop','speed'],['punc',': '],['str','"rápido"']],
    [['punc','};']],
    [['fn','lanzar'],['punc','('],['var','proyecto'],['punc',');']]
  ];  const typed = document.getElementById('typed');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (new URLSearchParams(location.search).has('embed')){
    document.querySelector('.hint').style.display = 'none';
  }
  if (new URLSearchParams(location.search).has('flat')){
    document.body.style.justifyContent = 'flex-start';
    document.body.style.alignItems = 'flex-start';
  }
  const cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';
  let typeTimer = null;
  let queue = [];
  let qi = 0;

  function buildQueue(lines){
    const q = [];
    lines.forEach(line => {
      line.forEach(tok => {
        const cls = tok[0];
        for (const ch of tok[1]) q.push([ch, cls]);
      });
      q.push(['\n', '']);
    });
    return q;
  }

  function startTyping(){
    clearInterval(typeTimer);
    queue = buildQueue(snippet);
    qi = 0;
    typed.innerHTML = '';
    typed.appendChild(cursorEl);
    if (new URLSearchParams(location.search).has('still')){
      while (qi < queue.length){
        const [ch, cls] = queue[qi++];
        if (ch === '\n'){
          typed.appendChild(document.createTextNode('\n'));
        } else {
          const s = document.createElement('span');
          s.className = cls;
          s.textContent = ch;
          typed.appendChild(s);
        }
      }
      typed.appendChild(cursorEl);
      return;
    }
    const speed = reduce ? 0 : 22;
    typeTimer = setInterval(() => {
      if (qi >= queue.length){ clearInterval(typeTimer); return; }
      const [ch, cls] = queue[qi++];
      if (ch === '\n'){
        typed.appendChild(document.createTextNode('\n'));
      } else {
        const s = document.createElement('span');
        s.className = cls;
        s.textContent = ch;
        typed.appendChild(s);
      }
      typed.appendChild(cursorEl);
    }, speed);
  }

  startTyping();</script>
</body>
</html>
