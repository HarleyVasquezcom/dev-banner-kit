<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram Story 1080×1920 — Programming &amp; Web Development — Español</title>
<style>
  :root{
    --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6; --green:#34d399; --amber:#fbbf24;
    --txt:#f1f5ff; --dim:rgba(241,245,255,.62);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#05060c;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    overflow:auto;
  }

  .stage{position:relative}

  /* ============ STORY 1080x1920 ============ */
  .story{
    position:absolute;top:0;left:0;
    width:1080px;height:1920px;
    transform-origin:top left;
    border-radius:48px;
    overflow:hidden;
    user-select:none;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 60px 160px -60px rgba(34,211,238,.25), 0 40px 120px -40px rgba(0,0,0,.9);
    background:linear-gradient(150deg,#070b18 0%,#0d1330 45%,#1b1040 100%);
    background-size:180% 180%;
    animation:bgShift 14s ease-in-out infinite alternate;
  }
  @keyframes bgShift{to{background-position:100% 100%}}

  .blob{position:absolute;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
  .blob.b1{width:620px;height:620px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%);animation:drift1 12s ease-in-out infinite alternate}
  .blob.b2{width:680px;height:680px;bottom:-240px;right:-220px;background:radial-gradient(circle,rgba(167,139,250,.4),transparent 70%);animation:drift2 15s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(150px,110px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-130px,-90px) scale(1.2)}}

  .grid-overlay{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 78%);
  }

  .symbols{position:absolute;inset:0;z-index:1;pointer-events:none}
  .sym{
    position:absolute;bottom:-60px;
    font-family:Consolas,"Cascadia Code",monospace;font-weight:700;
    animation:rise linear infinite;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translateY(0);opacity:0}
    10%{opacity:var(--o,.35)}
    80%{opacity:var(--o,.35)}
    100%{transform:translateY(-2060px);opacity:0}
  }

  .inner{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;
    padding:220px 76px 230px;
    gap:30px;
  }

  
  /* top row */
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{
    width:108px;height:108px;border-radius:30px;display:grid;place-items:center;
    font:700 40px/1 Consolas,monospace;color:#071018;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 18px 50px -18px rgba(34,211,238,.65);
  }
  .lang{
    display:flex;padding:8px;border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
  }
  .lang button{
    border:0;background:transparent;cursor:pointer;
    color:var(--dim);padding:16px 30px;border-radius:999px;
    font:700 26px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;
    transition:color .2s ease, background .2s ease;
  }
  .lang button.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#071018}
  .lang button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

  /* status */
  .status{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:600;color:var(--dim);letter-spacing:.03em}
  .live-dot{width:20px;height:20px;border-radius:50%;background:var(--green);animation:ping 2s ease-out infinite;flex:none}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}
    70%{box-shadow:0 0 0 18px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  /* headline */
  h1{font-size:80px;line-height:1.16;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
  h1 span{display:block;color:var(--txt)}
  h1 .accent{
    background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* code window */
  .code{
    border-radius:32px;padding:36px 44px 44px;
    background:rgba(5,8,20,.74);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px -36px rgba(0,0,0,.85), inset 0 0 60px rgba(34,211,238,.05);
  }
  .code-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .wd{width:16px;height:16px;border-radius:50%}
  .wd.r{background:#ff5f57}.wd.y{background:#febc2e}.wd.g{background:#28c840}
  .code-name{margin-left:auto;font:600 26px/1 Consolas,monospace;color:rgba(241,245,255,.45);letter-spacing:.08em}
  .code pre{
    font:500 30px/1.5 Consolas,"Cascadia Code",monospace;
    color:#dbe7ff;height:360px;overflow:hidden;white-space:pre;
  }
  .kw{color:var(--violet)}
  .var{color:var(--cyan)}
  .punc{color:rgba(219,231,255,.55)}
  .prop{color:#93c5fd}
  .str{color:var(--green)}
  .fn{color:var(--amber)}
  .cursor{
    display:inline-block;width:18px;height:36px;border-radius:4px;
    background:var(--cyan);vertical-align:-6px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* service chips */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .chip{
    display:flex;align-items:center;gap:20px;
    padding:26px 32px;border-radius:24px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);
    font-size:32px;font-weight:600;color:var(--txt);
    white-space:nowrap;overflow:hidden;
    opacity:0;
    animation:pop .55s cubic-bezier(.2,.9,.3,1.35) forwards;
  }
  .chip:nth-child(1){animation-delay:.15s}
  .chip:nth-child(2){animation-delay:.28s}
  .chip:nth-child(3){animation-delay:.41s}
  .chip:nth-child(4){animation-delay:.54s}
  @keyframes pop{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
  .chip svg{width:40px;height:40px;flex:none}
  .chip:nth-child(1) svg{color:var(--cyan)}
  .chip:nth-child(2) svg{color:var(--violet)}
  .chip:nth-child(3) svg{color:var(--pink)}
  .chip:nth-child(4) svg{color:var(--green)}

  /* CTA */
  .cta-wrap{margin-top:auto;display:flex;flex-direction:column;gap:26px}
  .cta{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:22px;
    width:100%;padding:42px 48px;border:0;border-radius:30px;cursor:pointer;
    font:700 44px/1 "Segoe UI",system-ui,sans-serif;color:#071018;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--cyan));
    background-size:200% 100%;
    animation:ctaGrad 4s ease-in-out infinite alternate, ctaPulse 2.4s ease-in-out infinite;
  }
  @keyframes ctaGrad{to{background-position:100% 0}}
  @keyframes ctaPulse{
    0%,100%{box-shadow:0 24px 70px -24px rgba(34,211,238,.55)}
    50%{box-shadow:0 24px 90px -18px rgba(167,139,250,.8)}
  }
  .cta::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .cta svg{width:48px;height:48px;transition:transform .25s ease}
  .cta:hover svg{transform:translateX(10px)}
  .cta:focus-visible{outline:4px solid #fff;outline-offset:4px}
  .sub{text-align:center;font-size:30px;font-weight:600;color:var(--dim);letter-spacing:.02em}

  /* footer */
  .foot{
    text-align:center;font-size:24px;font-weight:700;
    letter-spacing:.18em;color:rgba(241,245,255,.38);
  }

  @media (prefers-reduced-motion: reduce){
    .story,.blob,.symbols,.cta,.cta::after{animation:none !important}
    .sym{display:none}
    .chip,.cursor{animation:none;opacity:1}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="story" id="story" aria-label="Instagram story — programming and web development services">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="grid-overlay"></div>

    <div class="symbols" aria-hidden="true">
      <span class="sym" style="left:5%;  font-size:52px; color:#22d3ee; --o:.4;  animation-duration:19s; animation-delay:-3s;  ">&lt;/&gt;</span>
      <span class="sym" style="left:20%; font-size:44px; color:#a78bfa; --o:.35; animation-duration:23s; animation-delay:-11s; ">{ }</span>
      <span class="sym" style="left:38%; font-size:48px; color:#f472b6; --o:.3;  animation-duration:16s; animation-delay:-6s;  ">=&gt;</span>
      <span class="sym" style="left:56%; font-size:44px; color:#34d399; --o:.35; animation-duration:21s; animation-delay:-16s; ">&lt;div&gt;</span>
      <span class="sym" style="left:74%; font-size:48px; color:#22d3ee; --o:.4;  animation-duration:17s; animation-delay:-9s;  ">npm</span>
      <span class="sym" style="left:87%; font-size:44px; color:#a78bfa; --o:.3;  animation-duration:24s; animation-delay:-2s;  ">JS</span>
      <span class="sym" style="left:11%; font-size:48px; color:#fbbf24; --o:.3;  animation-duration:20s; animation-delay:-13s; ">( )</span>
      <span class="sym" style="left:31%; font-size:44px; color:#22d3ee; --o:.35; animation-duration:22s; animation-delay:-19s; ">;</span>
      <span class="sym" style="left:48%; font-size:44px; color:#f472b6; --o:.3;  animation-duration:18s; animation-delay:-5s;  ">CSS</span>
      <span class="sym" style="left:66%; font-size:48px; color:#34d399; --o:.3;  animation-duration:25s; animation-delay:-12s; ">API</span>
      <span class="sym" style="left:81%; font-size:44px; color:#fbbf24; --o:.35; animation-duration:17s; animation-delay:-17s; ">$</span>
      <span class="sym" style="left:3%;  font-size:44px; color:#a78bfa; --o:.3;  animation-duration:23s; animation-delay:-8s;  ">{ }</span>
      <span class="sym" style="left:26%; font-size:52px; color:#f472b6; --o:.25; animation-duration:26s; animation-delay:-21s; ">&lt;/&gt;</span>
      <span class="sym" style="left:44%; font-size:40px; color:#22d3ee; --o:.3;  animation-duration:15s; animation-delay:-4s;  ">TS</span>
      <span class="sym" style="left:61%; font-size:44px; color:#a78bfa; --o:.3;  animation-duration:24s; animation-delay:-23s; ">=&gt;</span>
      <span class="sym" style="left:79%; font-size:40px; color:#34d399; --o:.3;  animation-duration:19s; animation-delay:-14s; ">&lt;html&gt;</span>
    </div>

    <div class="inner">
      <div class="top">
        <div class="logo">&lt;/&gt;</div>
        <div class="lang"><button class="lang-btn active" type="button">ES</button></div>
      </div>

      <div class="status">
        <span class="live-dot"></span>
        <span >Disponibles para nuevos proyectos</span>
      </div>

      <h1>
        <span >Convertimos ideas en</span>
        <span class="accent" >código real.</span>
      </h1>

      <div class="code">
        <div class="code-head">
          <span class="wd r"></span><span class="wd y"></span><span class="wd g"></span>
          <span class="code-name">app.js</span>
        </div>
        <pre><span id="typed"></span></pre>
      </div>

      <div class="chips">
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.6-4-9s1.5-6.4 4-9z"/></svg>
          <span >Sitios web</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
          <span >Apps móviles</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h7.6a1.6 1.6 0 0 0 1.6-1.3L20 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
          <span >Tiendas online</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13.5 3 5 13.5h5L10.5 21 19 10.5h-5L13.5 3z"/></svg>
          <span >SEO y velocidad</span>
        </div>
      </div>

      <div class="cta-wrap">
        <button class="cta" type="button">
          <span >Empieza tu proyecto</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <div class="sub" >Cotización gratis en 24 horas</div>
      </div>

      <div class="foot" >PROGRAMACIÓN Y DESARROLLO WEB</div>
    </div>
  </div>
</div>

<script>
  const snippet = [
    [['kw','const '],['var','proyecto'],['punc',' = {']],
    [['ind','  '],['prop','idea'],['punc',': '],['str','"tuya"'],['punc',',']],
    [['ind','  '],['prop','stack'],['punc',': '],['str','"moderno"'],['punc',',']],
    [['ind','  '],['prop','speed'],['punc',': '],['str','"rápido"'],['punc',',']],
    [['ind','  '],['prop','launch'],['punc',': '],['str','"esta semana"']],
    [['punc','};']],
    [['fn','lanzar'],['punc','('],['var','proyecto'],['punc',');']]
  ];  const story = document.getElementById('story');
  const stage = document.getElementById('stage');
  const fullSize = new URLSearchParams(location.search).has('full');

  function fit(){
    if (fullSize){
      document.body.style.justifyContent = 'flex-start';
      document.body.style.alignItems = 'flex-start';
      story.style.transform = 'none';
      stage.style.width = '1080px';
      stage.style.height = '1920px';
      return;
    }
    const s = Math.min(window.innerWidth / 1080, (window.innerHeight - 32) / 1920);
    story.style.transform = 'scale(' + s + ')';
    stage.style.width = Math.round(1080 * s) + 'px';
    stage.style.height = Math.round(1920 * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();  const typed = document.getElementById('typed');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';
  let typeTimer = null;
  let queue = [];
  let qi = 0;

  function buildQueue(lines){
    const q = [];
    lines.forEach(line => {
      line.forEach(tok => {
        const cls = tok[0];
        for (const ch of tok[1]) q.push([ch, cls]);
      });
      q.push(['\n', '']);
    });
    return q;
  }

  function startTyping(){
    clearInterval(typeTimer);
    queue = buildQueue(snippet);
    qi = 0;
    typed.innerHTML = '';
    typed.appendChild(cursorEl);
    if (new URLSearchParams(location.search).has('still')){
      while (qi < queue.length){
        const [ch, cls] = queue[qi++];
        if (ch === '\n'){
          typed.appendChild(document.createTextNode('\n'));
        } else {
          const s = document.createElement('span');
          s.className = cls;
          s.textContent = ch;
          typed.appendChild(s);
        }
      }
      typed.appendChild(cursorEl);
      return;
    }
    const speed = reduce ? 0 : 22;
    typeTimer = setInterval(() => {
      if (qi >= queue.length){ clearInterval(typeTimer); return; }
      const [ch, cls] = queue[qi++];
      if (ch === '\n'){
        typed.appendChild(document.createTextNode('\n'));
      } else {
        const s = document.createElement('span');
        s.className = cls;
        s.textContent = ch;
        typed.appendChild(s);
      }
      typed.appendChild(cursorEl);
    }, speed);
  }

  startTyping();</script>
</body>
</html>
